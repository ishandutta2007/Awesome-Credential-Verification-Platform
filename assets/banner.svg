<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beaconPulse {
        0% { r: 6; opacity: 0.9; }
        50% { r: 16; opacity: 0.3; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes shimmerText {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #a855f7; }
        100% { stop-color: #38bdf8; }
      }
      .animated-bg-glow1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 950px 180px;
      }
      .animated-bg-glow2 {
        animation: pulseGlow 9s ease-in-out infinite 2s;
        transform-origin: 250px 200px;
      }
      .animated-shield-group {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: 960px 190px;
      }
      .animated-badge-pill {
        animation: floatFast 5s ease-in-out infinite 1s;
      }
      .animated-stream {
        stroke-dasharray: 6, 6;
        animation: dashMove 2.5s linear infinite;
      }
      .beacon-ring1 {
        animation: beaconPulse 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .beacon-ring2 {
        animation: beaconPulse 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.4s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glow Blobs -->
  <circle class="animated-bg-glow1" cx="960" cy="190" r="160" fill="#6366f1" opacity="0.22" filter="url(#glow-purple)" />
  <circle class="animated-bg-glow2" cx="220" cy="190" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow-cyan)" />

  <!-- Circuit & Network Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="80" y1="60" x2="1120" y2="60" stroke-dasharray="4,8" />
    <line x1="80" y1="320" x2="1120" y2="320" stroke-dasharray="4,8" />
    <line x1="120" y1="40" x2="120" y2="340" stroke-dasharray="4,8" />
    <line x1="720" y1="40" x2="720" y2="340" stroke-dasharray="4,8" />
  </g>

  <!-- Left Content Section -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <circle class="beacon-ring1" cx="16" cy="16" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="30" y="21" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Credential
    </text>
    <text x="0" y="202" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Verification Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="244" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Decentralized Identity (SSI) • W3C Verifiable Credentials • Open Badges 3.0
    </text>
    <text x="0" y="268" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Tamper-Evident Digital Attestations, Zero-Knowledge Proofs &amp; Cryptographic Issuance
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 292)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="55" y="17" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">W3C VC / DID</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
      <text x="182" y="17" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Open Badges 3.0</text>

      <!-- Tag 3 -->
      <rect x="255" y="0" width="120" height="26" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="315" y="17" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Zero-Knowledge</text>

      <!-- Tag 4 -->
      <rect x="385" y="0" width="115" height="26" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
      <text x="442" y="17" text-anchor="middle" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">eIDAS 2.0 / SSI</text>
    </g>
  </g>

  <!-- Right Visual Section: Dynamic Credential Shield & Graphic -->
  <g class="animated-shield-group">
    <!-- Connecting Verification Lines -->
    <path class="animated-stream" d="M 830,110 L 960,190 L 820,270" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" />
    <path class="animated-stream" d="M 1090,120 L 960,190 L 1100,260" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.6" />

    <!-- Central Verifiable Shield Outer Aura -->
    <path d="M 960,80 L 1060,125 L 1060,215 C 1060,275 960,315 960,315 C 960,315 860,275 860,215 L 860,125 Z" 
          fill="none" stroke="url(#primary-grad)" stroke-width="3.5" filter="url(#glow-cyan)" />

    <!-- Central Verifiable Shield Body -->
    <path d="M 960,86 L 1052,128 L 1052,212 C 1052,267 960,305 960,305 C 960,305 868,267 868,212 L 868,128 Z" 
          fill="url(#shield-grad)" stroke="#475569" stroke-width="1.5" />

    <!-- Inner Graphic: Verified Checkmark + Cryptographic Keys -->
    <!-- Seal Circle -->
    <circle cx="960" cy="180" r="48" fill="#1e1b4b" stroke="url(#accent-emerald)" stroke-width="2.5" />
    
    <!-- Verified Ribbon/Polygon -->
    <polygon points="960,142 973,150 988,145 994,160 1009,168 1005,183 1016,197 1004,208 1007,224 991,228 984,242 969,240 960,252 951,240 936,242 929,228 913,224 916,208 904,197 915,183 911,168 926,160 932,145 947,150" 
             fill="#0284c7" opacity="0.4" />

    <!-- Big Checkmark -->
    <path d="M 942,180 L 954,193 L 980,165" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cryptographic Hash / VC Label Under Seal -->
    <rect x="910" y="246" width="100" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="960" y="260" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10" font-weight="700">VERIFIED VC</text>

    <!-- Floating Satellite Badges -->
    <!-- Satellite 1: Issuer Node -->
    <g class="animated-badge-pill" transform="translate(790, 95)">
      <rect width="90" height="34" rx="17" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="6" fill="#38bdf8" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">ISSUER</text>
    </g>

    <!-- Satellite 2: Verifier Node -->
    <g class="animated-badge-pill" transform="translate(1040, 105)">
      <rect width="95" height="34" rx="17" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="6" fill="#818cf8" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">VERIFIER</text>
    </g>

    <!-- Satellite 3: Holder Wallet Node -->
    <g class="animated-badge-pill" transform="translate(790, 255)">
      <rect width="88" height="34" rx="17" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="18" cy="17" r="6" fill="#34d399" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">WALLET</text>
    </g>

    <!-- Satellite 4: Trust Registry Node -->
    <g class="animated-badge-pill" transform="translate(1045, 245)">
      <rect width="98" height="34" rx="17" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="18" cy="17" r="6" fill="#c084fc" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">TRUST DID</text>
    </g>
  </g>
</svg>
